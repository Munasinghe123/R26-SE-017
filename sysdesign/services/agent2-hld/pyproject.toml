[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent2-hld"
version = "1.0.0"
description = "High-Level Architecture Agent (R26-SE-017)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "groq>=0.4.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "ollama>=0.4.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
    "networkx>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
