server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static React assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Orchestrator Routes (pipeline jobs & SSE streaming)
    location /jobs {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE Streaming support
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Health check for cloud load balancer / uptime ping
    location = /health {
        proxy_pass http://orchestrator:8000/health;
        proxy_set_header Host $host;
    }

    # Agent 4 — UI generator outputs & reviews
    location /api/ {
        proxy_pass http://agent4-ui:8004/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Agent 1 — Requirements Intelligence & Auth Routes
    location ~ ^/(register|login|auth|requirements|evaluate-requirements|refine-reqs|approve-reqs|projects|extract-requirements|users|livekit|live-meeting|meetings|notifications) {
        proxy_pass http://agent1-requirements:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
