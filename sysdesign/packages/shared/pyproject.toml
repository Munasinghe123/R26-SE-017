[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "1.0.0"
description = "R26-SE-017 shared utilities: Neon Postgres + artifact storage"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
