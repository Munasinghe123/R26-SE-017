# Alembic configuration for R26-SE-017 multi-agent SDLC system

[alembic]
script_location = .
version_locations = %(here)s/versions
file_template = %%(rev)s_%%(slug)s

# Neon Postgres pooler URL — reads from environment variable
sqlalchemy.url = %(NEON_DATABASE_URL)s

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
