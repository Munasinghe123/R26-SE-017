version: '3.8'

services:
  orchestrator:
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NEON_DATABASE_URL=${NEON_DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - agent2-hld

  agent2-hld:
    build:
      context: ..
      dockerfile: services/agent2-hld/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - LLM_BACKEND=groq
      - GROQ_API_KEY=${GROQ_API_KEY}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator
