name: Build and Push Docker Images to Docker Hub

on:
  push:
    branches: [ "agent-workflow", "main" ]
  workflow_dispatch:

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Orchestrator
      - name: Build & Push Orchestrator
        uses: docker/build-push-action@v5
        with:
          context: ./sysdesign
          file: ./sysdesign/services/orchestrator/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-orchestrator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-orchestrator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Agent 1 Requirements
      - name: Build & Push Agent 1 Requirements
        uses: docker/build-push-action@v5
        with:
          context: ./sysdesign
          file: ./sysdesign/services/agent1-requirements/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-agent1-requirements:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-agent1-requirements:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Agent 2 HLD
      - name: Build & Push Agent 2 HLD
        uses: docker/build-push-action@v5
        with:
          context: ./sysdesign
          file: ./sysdesign/services/agent2-hld/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-agent2-hld:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-agent2-hld:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Agent 3 LLD
      - name: Build & Push Agent 3 LLD
        uses: docker/build-push-action@v5
        with:
          context: ./sysdesign
          file: ./sysdesign/services/agent3-lld/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-agent3-lld:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-agent3-lld:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Agent 4 UI
      - name: Build & Push Agent 4 UI
        uses: docker/build-push-action@v5
        with:
          context: ./sysdesign
          file: ./sysdesign/services/agent4-ui/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-agent4-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-agent4-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. SRS Assembler
      - name: Build & Push SRS Assembler
        uses: docker/build-push-action@v5
        with:
          context: ./sysdesign
          file: ./sysdesign/services/srs-assembler/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-srs-assembler:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-srs-assembler:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Web (Nginx + React SPA)
      - name: Build & Push Web Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./sysdesign
          file: ./sysdesign/apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sysdesign-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
